name: Deploy playground

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build engine for wasm32
        run: cargo build -p zdb-wasm --release --target wasm32-unknown-unknown
      - name: Install matching wasm-bindgen-cli
        run: |
          VER=$(cargo metadata --format-version 1 | python3 -c "import json,sys; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']=='wasm-bindgen'))")
          echo "wasm-bindgen $VER"
          cargo install wasm-bindgen-cli --version "$VER"
      - name: Generate JS bindings
        run: |
          wasm-bindgen --out-dir web/playground/pkg --target web \
            target/wasm32-unknown-unknown/release/zdb_wasm.wasm
      - name: Assemble site
        run: |
          mkdir -p site
          cp web/playground/index.html site/
          cp -r web/playground/pkg site/pkg
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
